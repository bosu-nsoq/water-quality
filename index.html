<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Water Quality</title>
  <meta name="description" content="ระบบบันทึกคุณภาพน้ำ">
  
  <!-- PWA & Apple iOS Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a9396">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Water Quality">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/ZqRb8gnB/water-quality.png">
  <link rel="shortcut icon" href="https://i.postimg.cc/ZqRb8gnB/water-quality.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/ZqRb8gnB/water-quality.png">
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.postimg.cc/ZqRb8gnB/water-quality.png">
  <link rel="apple-touch-icon" sizes="512x512" href="https://i.postimg.cc/ZqRb8gnB/water-quality.png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SweetAlert2 สำหรับ Popup -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Google Fonts: Mali (สำหรับหน้าจอทั่วไป) และ Sarabun (สำหรับเอกสารพิมพ์รายงานทางการ) -->
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0a9396;
      --primary-dark: #005f73;
      --accent: #94d2bd;
      --text-main: #003049;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: url('https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?ixlib=rb-4.0.3&auto=format&fit=crop&w=1080&q=80') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Mali', sans-serif;
      color: #0b3d91;
      min-height: 100vh;
      margin: 0;
      padding: max(12px, env(safe-area-inset-top, 12px)) 12px max(24px, env(safe-area-inset-bottom, 24px)) 12px;
    }
    
    .main-wrapper {
      max-width: 540px;
      margin: 0 auto;
      width: 100%;
    }

    /* แถบสถานะผู้ใช้งาน (Guest / Admin) */
    .glass-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 8px 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 20px rgba(0, 50, 100, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

    .user-pill {
      background: rgba(148, 210, 189, 0.35);
      color: #005f73;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(148, 210, 189, 0.7);
    }

    .user-pill.admin {
      background: #fef08a;
      color: #854d0e;
      border-color: #fde047;
    }

    .btn-auth {
      font-size: 12.5px;
      border-radius: 20px;
      padding: 4px 12px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid #0a9396;
      background: #ffffff;
      color: #005f73;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-auth:hover {
      background: #0a9396;
      color: #ffffff;
    }
    .btn-auth.logout {
      border-color: #e63946;
      color: #e63946;
    }
    .btn-auth.logout:hover {
      background: #e63946;
      color: #ffffff;
    }

    .btn-pin-change {
      font-size: 11px;
      background: transparent;
      border: none;
      color: #854d0e;
      text-decoration: underline;
      padding: 0 4px;
      cursor: pointer;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 50, 100, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* Responsive Single-line Header สำหรับมือถือแนวตั้ง */
    .app-title {
      color: var(--primary-dark);
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      font-size: clamp(1.25rem, 5.2vw, 1.7rem);
      line-height: 1.3;
      margin-bottom: 0;
    }

    label { 
      font-weight: 600; 
      color: var(--primary); 
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .form-control, .form-select { 
      border-radius: 12px; 
      border: 2px solid var(--accent); 
      font-family: 'Mali', sans-serif;
      font-size: 16px; /* ป้องกัน iOS ซูมหน้าจอเมื่อแตะช่องพิมพ์ */
      min-height: 46px;
    }
    .form-control:focus, .form-select:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 0.25rem rgba(10, 147, 150, 0.25); 
    }
    
    .btn-custom { 
      border-radius: 12px; 
      font-weight: 600; 
      padding: 11px 16px; 
      width: 100%; 
      margin-bottom: 10px; 
      transition: all 0.2s ease-in-out;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-save { background-color: var(--primary); color: white; border: none; }
    .btn-save:hover, .btn-save:active { background-color: var(--primary-dark); color: white; }
    .btn-history { background-color: var(--accent); color: var(--text-main); border: none; }
    .btn-history:hover, .btn-history:active { background-color: #72ba9f; color: var(--text-main); }
    .btn-stats { background-color: #e9d8a6; color: var(--text-main); border: none; }
    .btn-stats:hover, .btn-stats:active { background-color: #dfca8d; color: var(--text-main); }
    .btn-print { background-color: var(--primary-dark); color: white; border: none; }
    .btn-print:hover, .btn-print:active { background-color: #004b5c; color: white; }
    .btn-back { background-color: #ee9b00; color: white; border: none; }
    .btn-back:hover, .btn-back:active { background-color: #ca8200; color: white; }

    #mainSection, #historySection { display: none; }
    #statsSection { display: block; } /* โหมด Guest: แสดงเป็นกราฟในหน้าแรกเลย */

    .table { font-size: 0.85rem; background-color: white; border-radius: 12px; overflow: hidden; }
    .table th { background-color: var(--primary); color: white; font-weight: 600; }
    .badge-result { font-size: 0.78rem; padding: 4px 10px; border-radius: 14px; margin-top: 4px; display: inline-block; }
    
    /* แจ้งเตือนภาพรวม */
    #overallFeedback { font-size: 1.05rem; color: var(--text-main); }

    /* ปฏิทินแบบคลิกเลือกทันที ไม่มีไอคอนรก */
    .date-picker-container {
      position: relative;
      width: 100%;
    }
    #recordDateDisplay, .date-display-input {
      cursor: pointer;
      background-color: #ffffff;
      text-align: center;
      font-weight: 600;
      color: var(--primary-dark);
    }
    #recordDate, .date-raw-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }
    #recordDate::-webkit-calendar-picker-indicator,
    .date-raw-input::-webkit-calendar-picker-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* กล่องกราฟปรับให้เหมาะกับมือถือ */
    .chart-box {
      position: relative;
      width: 100%;
      height: 290px;
      margin-bottom: 16px;
    }

    /* ------------------------------------------------------------ */
    /* การควบคุมการแสดงผลตามสิทธิ์ Guest vs Admin */
    /* ------------------------------------------------------------ */
    .admin-only {
      display: none !important;
    }
    body.is-admin .admin-only {
      display: block !important;
    }
    body.is-admin .admin-only-flex {
      display: flex !important;
    }
    body.is-admin .guest-only {
      display: none !important;
    }

    /* ------------------------------------------------------------ */
    /* หน้าโหลดข้อมูลน่ารักๆ (Cute Loader) */
    /* ------------------------------------------------------------ */
    .cute-loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(240, 249, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .cute-loader-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cute-loader-card {
      background: rgba(255, 255, 255, 0.96);
      padding: 26px 32px;
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 95, 115, 0.18);
      border: 2px solid var(--accent);
      text-align: center;
      max-width: 300px;
      width: 82%;
    }

    .water-drop-animation {
      font-size: 52px;
      display: inline-block;
      animation: bounceWater 1.2s infinite ease-in-out;
      margin-bottom: 8px;
      filter: drop-shadow(0 6px 12px rgba(10, 147, 150, 0.3));
    }

    @keyframes bounceWater {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-15px) scale(1.1);
      }
    }

    .cute-loader-text {
      font-family: 'Mali', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 3px;
    }

    .cute-loader-subtext {
      font-family: 'Mali', sans-serif;
      font-size: 0.88rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .cute-spinner-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .cute-spinner-dots span {
      width: 9px;
      height: 9px;
      background-color: var(--primary);
      border-radius: 50%;
      display: inline-block;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .cute-spinner-dots span:nth-child(1) { animation-delay: -0.32s; }
    .cute-spinner-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* SweetAlert Mali font */
    .swal-font {
      font-family: 'Mali', sans-serif !important;
    }
    .swal2-container {
      font-family: 'Mali', sans-serif !important;
    }

    /* ปรับแต่งสำหรับหน้าจอมือถือขนาดเล็ก */
    @media (max-width: 480px) {
      .glass-panel {
        padding: 18px 14px;
        margin-top: 6px;
        border-radius: 16px;
      }
      .app-title {
        font-size: 1.3rem;
      }
      .chart-box {
        height: 260px;
      }
      .table {
        font-size: 0.78rem;
      }
      .table th, .table td {
        padding: 6px 3px;
      }
    }

    /* ------------------------------------------------------------ */
    /* รูปแบบการพิมพ์รายงานทางการ (ใช้ฟอนต์ Sarabun ตามมาตรฐาน) */
    /* ------------------------------------------------------------ */
    #printReportContainer {
      display: none;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm 15mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: 'Sarabun', sans-serif !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .main-wrapper, .glass-panel, .glass-bar, .swal2-container, #waterForm, button, select, input, hr {
        display: none !important;
      }
      #printReportContainer {
        display: block !important;
        font-family: 'Sarabun', sans-serif !important;
        color: #111827 !important;
        background: #ffffff !important;
        width: 100% !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body>

<!-- หน้าโหลดข้อมูลน่ารักๆ "กำลังโหลด" ก่อนแสดงข้อมูลปัจจุบัน -->
<div id="cuteLoader" class="cute-loader-overlay">
  <div class="cute-loader-card">
    <div class="water-drop-animation">💧</div>
    <div class="cute-loader-text">กำลังโหลด...</div>
    <div class="cute-loader-subtext">ระบบบันทึกคุณภาพน้ำ 🌊</div>
    <div class="cute-spinner-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<div class="container main-wrapper">
  <!-- แถบสถานะผู้ใช้งาน (Guest / Admin) พร้อมปุ่มใส่ PIN เข้าสู่ระบบ -->
  <div class="glass-bar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <span id="roleBadge" class="user-pill">👤 ทั่วไป (Guest)</span>
      <span id="adminChangePinBox" class="admin-only" style="display:none;">
        <button type="button" class="btn-pin-change" onclick="changeAdminPin()">เปลี่ยน PIN</button>
      </span>
    </div>
    <button type="button" class="btn-auth" id="authBtn" onclick="handleAuthClick()">
      🔑 เข้าสู่ระบบ Admin
    </button>
  </div>

  <!-- 1. หน้าสถิติและกราฟ (แสดงเป็นหน้าแรกเลยสำหรับโหมด Guest และ Admin) -->
  <div class="glass-panel" id="statsSection">
    <h3 class="app-title">📊 สถิติคุณภาพน้ำ</h3>
    
    <!-- ปุ่มสำหรับ Admin สลับไปหน้าบันทึกผล -->
    <div class="admin-only my-3">
      <div class="row g-2">
        <div class="col-6">
          <button type="button" class="btn btn-custom btn-save" onclick="showSection('mainSection')">➕ บันทึกข้อมูล</button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-custom btn-history" onclick="showSection('historySection')">📜 ดูประวัติ</button>
        </div>
      </div>
    </div>

    <label class="mt-2">📅 เลือกช่วงเวลาแสดงผล:</label>
    <select class="form-select mb-2" id="timeFilter" onchange="onTimeFilterChange()">
      <option value="all">ทั้งหมด</option>
      <option value="week">สัปดาห์นี้</option>
      <option value="month">เดือนนี้</option>
      <option value="year">ปีนี้</option>
      <option value="custom">กำหนดช่วงวันที่เอง...</option>
    </select>

    <!-- ช่องกำหนดช่วงวันที่เอง (แสดงเมื่อเลือก กำหนดช่วงวันที่เอง) -->
    <div id="customDateRangeBox" style="display: none;" class="mb-3">
      <div class="row g-2">
        <div class="col-6">
          <label style="font-size: 0.85rem;">ตั้งแต่วันที่:</label>
          <div class="date-picker-container">
            <input type="text" class="form-control date-display-input" id="customStartDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker('customStart')">
            <input type="date" class="form-control date-raw-input" id="customStart" onchange="onDateChange('customStart', 'customStartDisplay', this.value); updateChart();">
          </div>
        </div>
        <div class="col-6">
          <label style="font-size: 0.85rem;">ถึงวันที่:</label>
          <div class="date-picker-container">
            <input type="text" class="form-control date-display-input" id="customEndDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker('customEnd')">
            <input type="date" class="form-control date-raw-input" id="customEnd" onchange="onDateChange('customEnd', 'customEndDisplay', this.value); updateChart();">
          </div>
        </div>
      </div>
    </div>

    <!-- กราฟ Chart.js ปรับขนาดให้เหมาะกับมือถือแนวตั้ง -->
    <div class="chart-box">
      <canvas id="waterChart"></canvas>
    </div>

    <!-- ปุ่มสำหรับ Guest: ดูประวัติย้อนหลัง -->
    <button type="button" class="btn btn-custom btn-history guest-only" onclick="showSection('historySection')">
      📜 ดูประวัติย้อนหลัง
    </button>

    <!-- ปุ่มสำหรับ Admin: พิมพ์รายงานกราฟ -->
    <button type="button" class="btn btn-custom btn-print admin-only" onclick="printReport()">
      🖨️ พิมพ์รายงานกราฟ
    </button>
  </div>

  <!-- 2. หน้าประวัติและพิมพ์ประวัติ -->
  <div class="glass-panel" id="historySection">
    <h3 class="app-title">📜 ประวัติย้อนหลัง</h3>
    <button class="btn btn-custom btn-back my-3" onclick="goHome()">⬅️ กลับหน้าหลัก</button>
    
    <!-- ตัวเลือกช่วงเวลาของหน้าประวัติ -->
    <div class="mb-3">
      <label>📅 เลือกช่วงเวลาประวัติ:</label>
      <select class="form-select mb-2" id="historyTimeFilter" onchange="onHistoryFilterChange()">
        <option value="all">ทั้งหมด</option>
        <option value="week">สัปดาห์นี้</option>
        <option value="month">เดือนนี้</option>
        <option value="year">ปีนี้</option>
        <option value="custom">กำหนดช่วงวันที่เอง...</option>
      </select>

      <div id="historyCustomDateBox" style="display: none;" class="mb-2">
        <div class="row g-2">
          <div class="col-6">
            <label style="font-size: 0.85rem;">ตั้งแต่วันที่:</label>
            <div class="date-picker-container">
              <input type="text" class="form-control date-display-input" id="histStartDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker('histStart')">
              <input type="date" class="form-control date-raw-input" id="histStart" onchange="onDateChange('histStart', 'histStartDisplay', this.value); renderTable();">
            </div>
          </div>
          <div class="col-6">
            <label style="font-size: 0.85rem;">ถึงวันที่:</label>
            <div class="date-picker-container">
              <input type="text" class="form-control date-display-input" id="histEndDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker('histEnd')">
              <input type="date" class="form-control date-raw-input" id="histEnd" onchange="onDateChange('histEnd', 'histEndDisplay', this.value); renderTable();">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ตารางแสดงประวัติ -->
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle mb-0">
        <thead>
          <tr>
            <th width="34%">วันที่ (พ.ศ.)</th>
            <th width="33%">pH</th>
            <th width="33%">TDS</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr><td colspan="3">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ปุ่มพิมพ์ประวัติคุณภาพน้ำ (แสดงเฉพาะ Admin เท่านั้น) -->
    <button type="button" class="btn btn-custom btn-print mt-3 mb-1 admin-only" onclick="printHistoryReport()">
      🖨️ พิมพ์ประวัติคุณภาพน้ำ
    </button>
  </div>

  <!-- 3. หน้าบันทึกผล (เฉพาะ Admin ที่ใส่ PIN แล้วเท่านั้น) -->
  <div class="glass-panel" id="mainSection">
    <h3 class="app-title">💧 บันทึกคุณภาพน้ำ</h3>
    <hr class="my-3">
    
    <form id="waterForm" onsubmit="submitForm(event)">
      <!-- ช่องเลือกวันที่แบบ พ.ศ. (dd/mm/yyyy) คลิกเปิดปฏิทินทันที -->
      <div class="mb-3">
        <label>📅 วันที่บันทึก (พ.ศ.)</label>
        <div class="date-picker-container">
          <input type="text" class="form-control" id="recordDateDisplay" readonly placeholder="วว/ดด/ปปปป" onclick="openDatePicker('recordDate')" title="คลิกเพื่อเลือกวันที่">
          <input type="date" class="form-control" id="recordDate" onchange="onDateChange('recordDate', 'recordDateDisplay', this.value)" required>
        </div>
      </div>
      
      <div class="mb-3">
        <label>🧪 ค่า pH (0-14)</label>

<script>
  // ============================================================

      text: 'สลับกลับสู่โหมดทั่วไป (Guest)',

  function changeAdminPin() {

        <div style="font-family: 'Mali', sans-serif; text-align: left; font-size: 0.9rem;">
          <label class="mb-1">รหัส PIN เดิม:</label>

  // ------------------------------------------------------------
  // ระบบจัดการวันที่ตามมาตรฐานไทย พ.ศ. (dd/mm/yyyy)
  // ------------------------------------------------------------
  function openDatePicker(inputId) {
    const el = document.getElementById(inputId);
    if (el) {
      if (typeof el.showPicker === 'function') {
        try { el.showPicker(); return; } catch(e) {}
      }
      el.focus();
      el.click();
    }
  }

  function formatBE(isoDateStr) {
    if (!isoDateStr) return '';
    const parts = isoDateStr.split('-');
    if (parts.length === 3) {
      let y = parseInt(parts[0], 10);
      let yBE = y > 2400 ? y : y + 543;
      let m = parts[1].padStart(2, '0');
      let d = parts[2].padStart(2, '0');
      return `${d}/${m}/${yBE}`;
    }
    return isoDateStr;
  }

  function onDateChange(inputId, displayId, val) {
    const display = document.getElementById(displayId);
    if (!val) { if (display) display.value = ''; return; }
    if (display) display.value = formatBE(val);
  }

  function initDefaultDate() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const isoToday = `${yyyy}-${mm}-${dd}`;
    
    const dateInput = document.getElementById('recordDate');
    const dateDisplay = document.getElementById('recordDateDisplay');
    if (dateInput) dateInput.value = isoToday;
    if (dateDisplay) dateDisplay.value = formatBE(isoToday);

    // ย้อนหลัง 30 วันสำหรับเริ่มต้น
    const past30 = new Date();
    past30.setDate(past30.getDate() - 30);
    const pastY = past30.getFullYear();
    const pastM = String(past30.getMonth() + 1).padStart(2, '0');
    const pastD = String(past30.getDate()).padStart(2, '0');
    const isoPast = `${pastY}-${pastM}-${pastD}`;

    // กำหนดค่าเริ่มต้นช่วงวันที่หน้าสถิติ
    const customEnd = document.getElementById('customEnd');
    const customEndDisplay = document.getElementById('customEndDisplay');
    if (customEnd) customEnd.value = isoToday;
    if (customEndDisplay) customEndDisplay.value = formatBE(isoToday);

    const customStart = document.getElementById('customStart');
    const customStartDisplay = document.getElementById('customStartDisplay');
    if (customStart) customStart.value = isoPast;
    if (customStartDisplay) customStartDisplay.value = formatBE(isoPast);

    // กำหนดค่าเริ่มต้นช่วงวันที่หน้าประวัติ
    const histEnd = document.getElementById('histEnd');
    const histEndDisplay = document.getElementById('histEndDisplay');
    if (histEnd) histEnd.value = isoToday;
    if (histEndDisplay) histEndDisplay.value = formatBE(isoToday);

    const histStart = document.getElementById('histStart');
    const histStartDisplay = document.getElementById('histStartDisplay');
    if (histStart) histStart.value = isoPast;
    if (histStartDisplay) histStartDisplay.value = formatBE(isoPast);
  }

  function parseThaiDate(dateStr) {
    if (!dateStr) return new Date();
    if (dateStr instanceof Date) return dateStr;
    const str = String(dateStr).trim();
    if (str.includes('/')) {
      const parts = str.split('/');
      const d = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;
      let y = parseInt(parts[2], 10);
      if (y > 2400) y -= 543;
      return new Date(y, m, d);
    } else if (str.includes('-')) {
      const parts = str.split('T')[0].split('-');
      let y = parseInt(parts[0], 10);
      if (y > 2400) y -= 543;
      const m = parseInt(parts[1], 10) - 1;
      const d = parseInt(parts[2], 10);
      return new Date(y, m, d);
    }
    const dObj = new Date(str);
    return isNaN(dObj.getTime()) ? new Date() : dObj;
  }

  function formatDisplayDateBE(dateVal) {
    if (!dateVal) return '';
    const str = String(dateVal).trim();
    if (str.includes('/')) {
      const parts = str.split('/');
      if (parts.length === 3) {
        let d = parts[0].padStart(2, '0');
        let m = parts[1].padStart(2, '0');
        let y = parseInt(parts[2], 10);
        if (y < 2400) y += 543;
        return `${d}/${m}/${y}`;
      }
    } else if (str.includes('-')) {
      const parts = str.split('T')[0].split('-');
      if (parts.length === 3) {
        let y = parseInt(parts[0], 10);
        if (y < 2400) y += 543;
        let m = parts[1].padStart(2, '0');
        let d = parts[2].padStart(2, '0');
        return `${d}/${m}/${y}`;
      }
    }
    const dObj = parseThaiDate(dateVal);
    const day = String(dObj.getDate()).padStart(2, '0');
    const mon = String(dObj.getMonth() + 1).padStart(2, '0');
    const yr = dObj.getFullYear() + 543;
    return `${day}/${mon}/${yr}`;
  }

  // ------------------------------------------------------------
  // สร้างป้ายสีสำหรับการแปลผล (คงรูปแบบเดิม 100%)
  // ------------------------------------------------------------
  function getBadgeHTML(statusText) {
    if (statusText === "ดี") return `<span class="badge bg-success badge-result">${statusText}</span>`;
    if (statusText === "พอใช้") return `<span class="badge bg-warning text-dark badge-result">${statusText}</span>`;
    return `<span class="badge bg-danger badge-result">${statusText}</span>`;
  }

  // ------------------------------------------------------------
  // ฟังก์ชันแปลผลทั้งหมดแบบ Real-time (คงตรรกะเดิม 100%)
  // ------------------------------------------------------------
  function previewAll() {
    let phVal = parseFloat(document.getElementById('phValue').value);
    let tdsVal = parseFloat(document.getElementById('tdsValue').value);
    
    let phFb = document.getElementById('phFeedback');
    let tdsFb = document.getElementById('tdsFeedback');
    let overallFb = document.getElementById('overallFeedback');
    
    let phRes = "";
    if (!isNaN(phVal)) {
      if (phVal < 6.5) phRes = "ควรปรับปรุง";
      else if (phVal < 6.9) phRes = "พอใช้";
      else if (phVal < 7.6) phRes = "ดี";
      else if (phVal <= 8.5) phRes = "พอใช้";
      else phRes = "ควรปรับปรุง";
      phFb.innerHTML = "แปลผล: " + getBadgeHTML(phRes);
    } else { phFb.innerHTML = ""; }
    
    let tdsRes = "";
    if (!isNaN(tdsVal)) {
      if (tdsVal < 500) tdsRes = "ดี";
      else if (tdsVal <= 1000) tdsRes = "พอใช้";
      else tdsRes = "ควรปรับปรุง";
      tdsFb.innerHTML = "แปลผล: " + getBadgeHTML(tdsRes);
    } else { tdsFb.innerHTML = ""; }
    
    // แปลผลรวม
    if (phRes && tdsRes) {
      let overall = "";
      if (phRes === "ควรปรับปรุง" || tdsRes === "ควรปรับปรุง") overall = "ควรปรับปรุง";
      else if (phRes === "พอใช้" || tdsRes === "พอใช้") overall = "พอใช้";
      else overall = "ดี";
      overallFb.innerHTML = "🌟 ภาพรวมน้ำ: " + getBadgeHTML(overall);
    } else { overallFb.innerHTML = ""; }
  }

  // ------------------------------------------------------------
  // บันทึกข้อมูลไปยัง Google Sheets (เฉพาะ Admin)
  // ------------------------------------------------------------
  async function callSaveApi(dateStr, ph, tds) {
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'saveData', date: dateStr, ph: ph, tds: tds })
      });
      const resJson = await response.json();
      if (resJson.status === 'success') {
        return resJson.data;
      }
    } catch (err) {
      const getUrl = `${SCRIPT_URL}?action=saveData&date=${encodeURIComponent(dateStr)}&ph=${encodeURIComponent(ph)}&tds=${encodeURIComponent(tds)}`;
      const getRes = await fetch(getUrl);
      const getJson = await getRes.json();
      if (getJson.status === 'success') {
        return getJson.data;
      }
    }
    throw new Error('ไม่สามารถบันทึกข้อมูลไปยัง Google Sheets ได้');
  }

  // ฟังก์ชันบันทึกข้อมูล พร้อม Popup
  async function submitForm(event) {
    event.preventDefault();
    if (!isAdmin) {
      promptAdminPin();
      return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = "กำลังบันทึก... ⏳";

    const rawDate = document.getElementById('recordDate').value;
    const dateFormatted = formatBE(rawDate);
    const ph = document.getElementById('phValue').value;
    const tds = document.getElementById('tdsValue').value;

    try {
      const res = await callSaveApi(dateFormatted, ph, tds);

      Swal.fire({
        title: 'บันทึกสำเร็จ!',
        html: `<b>สรุปคุณภาพน้ำ: ${getBadgeHTML(res.overall)}</b><br><br>
               💧 ค่า pH: <b>${res.ph}</b> (${getBadgeHTML(res.phStatus)})<br>
               🔬 ค่า TDS: <b>${res.tds}</b> ppm (${getBadgeHTML(res.tdsStatus)})`,
        icon: 'success',
        confirmButtonColor: '#0a9396',
        customClass: { popup: 'swal-font' }
      });

      document.getElementById('waterForm').reset();
      initDefaultDate();
      document.getElementById('phFeedback').innerHTML = "";
      document.getElementById('tdsFeedback').innerHTML = "";
      document.getElementById('overallFeedback').innerHTML = "";
      btn.disabled = false;
      btn.innerHTML = "💾 บันทึกผล";
      loadData();
    } catch (err) {
      console.error(err);
      Swal.fire({
        title: 'บันทึกไม่สำเร็จ',
        text: 'กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง',
        icon: 'error',
        confirmButtonColor: '#0a9396',
        customClass: { popup: 'swal-font' }
      });
      btn.disabled = false;
      btn.innerHTML = "💾 บันทึกผล";
    }
  }

  // สลับหน้าจอ (หากเป็น Guest และพยายามเข้าหน้า mainSection ให้แจ้งเตือน PIN)
  function showSection(sectionId) {
    if (sectionId === 'mainSection' && !isAdmin) {
      promptAdminPin();
      return;
    }
    document.getElementById('mainSection').style.display = 'none';
    document.getElementById('historySection').style.display = 'none';
    document.getElementById('statsSection').style.display = 'none';
    document.getElementById(sectionId).style.display = 'block';
    
    if (sectionId === 'statsSection') updateChart();
    if (sectionId === 'historySection') renderTable();

  // ฟังก์ชันซ่อนหน้าจอโหลดข้อมูล
  function hideLoader() {
    const loader = document.getElementById('cuteLoader');
    if (loader && !loader.classList.contains('fade-out')) {
      loader.classList.add('fade-out');
      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    }
  }

  // โหลดข้อมูลประวัติสดจาก Google Sheets อัตโนมัติในเบื้องหลัง
  async function loadData() {
    try {
      const response = await fetch(`${SCRIPT_URL}?action=getHistory`);
      const resJson = await response.json();
      if (resJson.status === 'success' && Array.isArray(resJson.data)) {
        rawData = resJson.data;
        renderTable();
        updateChart();
      }
    } catch (err) {
      console.warn("Auto sync background fetch:", err);
    } finally {
      hideLoader(); // ซ่อนหน้าโหลดข้อมูลน่ารักๆ เมื่อข้อมูลโหลดเสร็จ
    }
  }

  // ------------------------------------------------------------
  // คัดกรองข้อมูลหน้าประวัติ
  // ------------------------------------------------------------
  function onHistoryFilterChange() {
    const filter = document.getElementById('historyTimeFilter').value;
    const box = document.getElementById('historyCustomDateBox');
    if (box) {
      box.style.display = (filter === 'custom') ? 'block' : 'none';
    }
    renderTable();
  }

  function getFilteredHistoryData() {
    const filter = document.getElementById('historyTimeFilter') ? document.getElementById('historyTimeFilter').value : 'all';
    const today = new Date();
    today.setHours(23, 59, 59, 999);
    
    return rawData.filter(row => {
      if (filter === 'all') return true;
      let rowDate = parseThaiDate(row[0]);
      if (isNaN(rowDate.getTime())) return true;
      
      if (filter === 'year') {
        return rowDate.getFullYear() === today.getFullYear();
      }
      if (filter === 'month') {
        return rowDate.getMonth() === today.getMonth() && rowDate.getFullYear() === today.getFullYear();
      }
      if (filter === 'week') {
        let diffTime = today.getTime() - rowDate.getTime();
        let diffDays = diffTime / (1000 * 60 * 60 * 24);
        return diffDays >= 0 && diffDays <= 7;
      }
      if (filter === 'custom') {
        const sRaw = document.getElementById('histStart') ? document.getElementById('histStart').value : '';
        const eRaw = document.getElementById('histEnd') ? document.getElementById('histEnd').value : '';
        if (!sRaw && !eRaw) return true;
        let sDate = sRaw ? new Date(sRaw) : new Date(0);
        sDate.setHours(0, 0, 0, 0);
        let eDate = eRaw ? new Date(eRaw) : new Date(8640000000000000);
        eDate.setHours(23, 59, 59, 999);
        return rowDate >= sDate && rowDate <= eDate;
      }

  // ระบบคัดกรองข้อมูลหน้าสถิติ (ทั้งหมด, สัปดาห์นี้, เดือนนี้, ปีนี้, กำหนดเอง)
  // ------------------------------------------------------------
  function onTimeFilterChange() {
    const filter = document.getElementById('timeFilter').value;
    const customBox = document.getElementById('customDateRangeBox');
    if (filter === 'custom') {
      customBox.style.display = 'block';
    } else {
      customBox.style.display = 'none';
    }
    updateChart();
  }

  function getFilteredData() {
    const filter = document.getElementById('timeFilter').value;
    const today = new Date();
    today.setHours(23, 59, 59, 999);
    
    return rawData.filter(row => {
      if (filter === 'all') return true;
      let rowDate = parseThaiDate(row[0]);
      if (isNaN(rowDate.getTime())) return true;
      
      if (filter === 'year') {
        return rowDate.getFullYear() === today.getFullYear();
      }
      if (filter === 'month') {
        return rowDate.getMonth() === today.getMonth() && rowDate.getFullYear() === today.getFullYear();
      }
      if (filter === 'week') {
        let diffTime = today.getTime() - rowDate.getTime();
        let diffDays = diffTime / (1000 * 60 * 60 * 24);
        return diffDays >= 0 && diffDays <= 7;
      }
      if (filter === 'custom') {
        const sRaw = document.getElementById('customStart').value;
        const eRaw = document.getElementById('customEnd').value;
        if (!sRaw && !eRaw) return true;
        let sDate = sRaw ? new Date(sRaw) : new Date(0);
        sDate.setHours(0, 0, 0, 0);
        let eDate = eRaw ? new Date(eRaw) : new Date(8640000000000000);
        eDate.setHours(23, 59, 59, 999);
        return rowDate >= sDate && rowDate <= eDate;
      }
      return true;
    });
  }

    const filteredData = getFilteredData();
    const labels = filteredData.map(row => formatDisplayDateBE(row[0]));
    const phData = filteredData.map(row => row[1]);
    const tdsData = filteredData.map(row => row[3]);

    drawChart(labels, phData, tdsData);
