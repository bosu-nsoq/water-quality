<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005f73"/>
      <stop offset="100%" stop-color="#0a9396"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0fbfc"/>
      <stop offset="60%" stop-color="#94d2bd"/>
      <stop offset="100%" stop-color="#0a9396"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001219" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer circle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
  
  <!-- Water drop -->
  <path d="M 256 80 C 256 80 140 230 140 330 C 140 394 192 440 256 440 C 320 440 372 394 372 330 C 372 230 256 80 256 80 Z" 
        fill="url(#dropGrad)" filter="url(#shadow)"/>
  
  <!-- Light reflection highlight -->
  <path d="M 256 120 C 256 120 185 240 180 320 C 178 300 185 220 235 150 C 248 132 256 120 256 120 Z" 
        fill="rgba(255,255,255,0.6)"/>
  
  <!-- Wave line / Quality check badge symbol -->
  <path d="M 200 350 Q 230 330 256 350 T 312 350" fill="none" stroke="#005f73" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="275" r="16" fill="#ee9b00"/>
  <circle cx="215" cy="295" r="10" fill="#94d2bd"/>
  <circle cx="297" cy="295" r="10" fill="#94d2bd"/>
</svg>
